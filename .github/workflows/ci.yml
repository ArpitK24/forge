# GitHub Actions CI for Forge.
# Phase 4 Step 2: cross-platform guarantees.
# Phase 4 Step 10: MCP real-server smoke test on ubuntu-only.
#
# Triggers:
#   - every push to main
#   - every PR targeting main
#   - manual dispatch (workflow_dispatch)
#
# Matrix:
#   ubuntu-latest, macos-latest, windows-latest — proves the
#   build works on all three supported platforms. The Windows
#   runner catches GDI / signal-handling regressions; the Linux
#   runner catches Unix-only build-tag / syscall regressions;
#   the macOS runner catches Mach-O / fork(2) regressions.
#
# Each matrix leg runs:
#   1. go vet ./...     — static analysis
#   2. go test -count=1 ./... — full test suite (no cache)
#   3. ./scripts/build.sh — produce the per-OS static binaries
#      (Ubuntu-only; the binaries are produced for the matrix
#      host, not for all targets — cross-compile to every target
#      from every host is the script's job, but only the
#      matching-target binary gets used as an artifact)
#   4. (ubuntu-only) MCP smoke test: spawns an embedded Node
#      mock MCP server (newline-delimited JSON on stdio, per the
#      MCP spec) and exercises the full Manager → mcpTool →
#      Client pipeline. Every leg's `go test ./...` also runs the
#      stdio spec-peer interop test (internal/mcp/stdio_spec_test.go).
#   5. (ubuntu-only) TUI flake check: go test -count=5
#      ./internal/tui/... — catches timing-sensitive regressions
#      in the picker / resume / save paths before they ship.
#      Cross-platform coverage of the TUI happy path is still
#      provided by step 2 on every matrix leg.
#
# Artifacts:
#   - per-OS forge binary at the path matching the matrix OS
#     (forge-linux, forge-darwin, forge-windows.exe). These
#     become downloadable from the Actions run page.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: format + lint + race + coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.10"
          cache: true

      - name: gofmt check
        # Fails if any file is not gofmt-formatted. Fix locally
        # with `gofmt -w .`.
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt -w:"
            echo "$unformatted"
            exit 1
          fi

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0

      - name: Race detector + coverage
        # The race detector needs cgo. The shipped binaries stay
        # CGO_ENABLED=0; this only affects the test build.
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 -timeout 5m -covermode=atomic -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: |
          total="$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}')"
          echo "Total coverage: $total"
          {
            echo "### Test coverage: $total"
            echo
            echo '| Package | Coverage |'
            echo '|---|---|'
            go test -count=1 -cover ./... 2>/dev/null \
              | awk '/coverage:/ {for (i=1;i<=NF;i++) if ($i=="coverage:") print "| " $2 " | " $(i+1) " |"}'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          retention-days: 14

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image
        run: docker build -t forge:ci .

      - name: Smoke test image
        run: docker run --rm forge:ci --version

  retrieval-eval:
    # Context-engine Milestone 0 (eval/README.md). Scores the B0/B1/B2
    # retrieval baselines on the internal Forge tasks twice and fails if
    # the two reports differ by a single byte. Drift from the committed
    # baseline is reported as a warning: regenerate it in the PR that
    # changes retrieval. Not a required check.
    name: retrieval eval (internal, determinism)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch pull request heads
        # Some internal tasks come from PR branch commits that were
        # squash-merged; their base commits live under refs/pull.
        run: git fetch --no-tags origin '+refs/pull/*/head:refs/remotes/origin/pr/*'

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.10"
          cache: true

      - name: Build
        run: go build -o forge-eval ./cmd/forge

      - name: Run twice and compare
        run: |
          set -euo pipefail
          for i in 1 2; do
            ./forge-eval eval retrieval --dataset internal --repo ArpitK24/forge=. \
              --no-fetch --strict --out "run$i.json" 2> "run$i.log"
          done
          cat run1.log
          cat run1.log | sed -n '/^| baseline/,$p' >> "$GITHUB_STEP_SUMMARY"
          if ! cmp -s run1.json run2.json; then
            echo "::error::retrieval eval is not deterministic: run1.json and run2.json differ"
            diff run1.json run2.json | head -50
            exit 1
          fi

      - name: Compare with committed baseline
        run: |
          if ! cmp -s run1.json eval/baselines/internal.json; then
            echo "::warning::retrieval results differ from eval/baselines/internal.json; regenerate it if the change is intended"
            diff eval/baselines/internal.json run1.json | head -40 || true
          fi

      - name: Upload results
        uses: actions/upload-artifact@v7
        with:
          name: retrieval-eval-internal
          path: run1.json
          retention-days: 14

  ci:
    name: vet + test + build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Don't cancel other legs when one fails — every platform's
      # signal is independently useful.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Pin to the version the project targets. AGENTS.md §1
          # says Go 1.26.10; the action's `go-version` accepts a
          # patch version.
          go-version: "1.26.10"
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test (no cache)
        # -count=1 disables Go's test-result cache so a passing
        # cached test isn't mistaken for a real pass.
        run: go test -count=1 ./...

      - name: Build static binary
        # Invoke via `bash` instead of `./scripts/build.sh` because
        # actions/checkout does not preserve the executable bit on
        # tracked files, and on the macOS / Linux runners the
        # direct invocation would fail with "Permission denied".
        # The shebang inside the script still selects bash.
        shell: bash
        run: bash scripts/build.sh ${{ matrix.os == 'windows-latest' && 'windows' || (matrix.os == 'macos-latest' && 'darwin' || 'linux') }}

      - name: MCP smoke test (mock server, ubuntu only)
        # Phase 4 step 10. The smoke suite uses an in-process
        # Node.js mock MCP server embedded as a string constant
        # in smoke_test.go — no npm install, no network, no
        # upstream server dependency. It exercises the full
        # Manager → mcpTool → Client → StdioTransport pipeline
        # against the same JSON-RPC 2.0 newline-delimited stdio
        # framing real servers use. Gated by the `mcp_smoke`
        # build tag so it never runs in default `go test ./...`.
        # ubuntu-only because the Windows runner's npx/Node
        # stdin-pipe plumbing has issues that we sidestep with
        # a direct `node mock-mcp-server.js` invocation.
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -euo pipefail
          # The mock script is written to t.TempDir() by the
          # test itself; we only need `node` on PATH. ubuntu-latest
          # ships Node preinstalled. If a future runner drops Node,
          # the test suite's requireNode() helper skips with a
          # clear message rather than failing the build.
          if ! command -v node >/dev/null 2>&1; then
            echo "node not on PATH; skipping MCP smoke suite" >&2
            exit 0
          fi
          go test -count=1 -tags mcp_smoke -run TestMcpMock -timeout 5m ./internal/mcp/...

      - name: TUI flake check (-count=5, ubuntu only)
        # Phase 4 step 11 added the sessions browser overlay,
        # /resume dispatch, and the resumed-save path. Several
        # tests use small time.Sleep gaps to space UpdatedAt
        # timestamps across SaveSession calls — fast clocks can
        # round those and turn the test flaky. Running the TUI
        # suite 5x in a row surfaces that class of bug before
        # it ships. ubuntu-only to keep CI minutes cheap; the
        # developer verifies macOS / Windows by hand on the
        # laptop. The broad `go test -count=1 ./...` step
        # above still runs the TUI tests once on every OS,
        # so we never lose cross-platform coverage of the
        # happy path.
        if: matrix.os == 'ubuntu-latest'
        run: go test -count=5 ./internal/tui/...

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: forge-${{ matrix.os == 'windows-latest' && 'windows' || (matrix.os == 'macos-latest' && 'darwin' || 'linux') }}
          # Glob dist/forge-* so the runner only uploads what it
          # actually built. Each matrix leg produces only the
          # binary matching its host OS, not all four targets —
          # listing each path literally would trip
          # if-no-files-found for the non-matching ones.
          path: dist/forge-*
          if-no-files-found: error
          retention-days: 14