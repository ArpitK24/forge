name: Bug report
description: Something in Forge doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. forge -p "..."
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Forge version
      description: Output of `forge --version`
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      options: [Linux, macOS, Windows, Other]
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Provider and model
      placeholder: e.g. Anthropic claude-sonnet-4-5, NVIDIA NIM nemotron-3.5-lightning-30b-a3b
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output. Remove API keys and anything private.
      render: shell
